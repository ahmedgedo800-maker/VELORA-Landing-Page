<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA - Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

    <div class="admin-header">
        <div>
            <h1>VELORA Admin Dashboard</h1>
            <p class="subtitle">Manage website content and company services</p>
        </div>

        <div class="user-section">
            <span id="userWelcome">Loading...</span>

            <button type="button" id="logoutBtn" class="logout-btn">
                Logout
            </button>
        </div>
    </div>


    
    <div class="form-box">

        <h2>Service Management</h2>

        <p class="box-description">
            Add, edit, or remove the services displayed on the public website.
        </p>

        <form id="serviceForm">

            <label for="serviceTitle">Service Title</label>

            <input
                type="text"
                id="serviceTitle"
                placeholder="Enter service title"
                required
            >

            <label for="serviceDescription">Service Description</label>

            <textarea
                id="serviceDescription"
                placeholder="Enter service description"
                required
            ></textarea>

            <button
                type="submit"
                class="add-btn"
                id="serviceSubmitButton"
            >
                Add Service
            </button>

            <button
                type="button"
                class="cancel-btn"
                id="cancelServiceEdit"
                hidden
            >
                Cancel Edit
            </button>

        </form>

    </div>


    <div class="content-box">

        <h2>Existing Services</h2>

        <div id="serviceList">
            <p>Loading services...</p>
        </div>

    </div>


    
    <div class="form-box">

        <h2>Content Management</h2>

        <form id="contentForm">

            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                placeholder="Enter content title"
                required
            >

            <label for="description">Description</label>

            <textarea
                id="description"
                placeholder="Enter content description"
                required
            ></textarea>

            <button
                type="submit"
                class="add-btn"
                id="submitButton"
            >
                Add Content
            </button>

        </form>

    </div>


    <div class="content-box">

        <h2>Existing Content</h2>

        <div id="contentList">
            <p>Loading content...</p>
        </div>

    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
